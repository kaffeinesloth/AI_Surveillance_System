name: ai_surveillance_system

services:
  backend:
    build:
      context: .
      target: backend
    init: true
    ports:
      - "8000:8000"
    env_file:
      - docker/backend.env
    volumes:
      - backend_database:/app/backend/database
      - backend_data:/app/backend/data
      - backend_models:/app/backend/models
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  frontend:
    build:
      context: .
      target: frontend
      args:
        BACKEND_URL: /api
    init: true
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  backend_database:
  backend_data:
  backend_models:
